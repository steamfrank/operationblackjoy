<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Diary Experience</title>
  
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }
    
    /* Simple UI Overlay */
    .ar-instruction {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85);
      color: #f3e9dc;
      padding: 10px 18px;
      border-radius: 20px;
      border: 1.5px solid #dda136;
      font-size: 0.85rem;
      font-weight: 600;
      z-index: 999;
      pointer-events: none;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="ar-instruction">Point camera around to position your diary entry</div>

  <a-scene 
    embedded 
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix;"
    vr-mode-ui="enabled: false">
    
    <a-assets>
      <img id="diary-img" src="assets/joy/joy-diary-text.png">
    </a-assets>

    <a-entity camera></a-entity>

    <a-plane 
      src="#diary-img" 
      position="0 0 -2.5" 
      width="2.5" 
      height="1.4" 
      material="transparent: true; opacity: 0.95;"
      shadow="cast: true">
    </a-plane>

  </a-scene>

</body>
</html>
