<script>
  AFRAME.registerComponent('pinch-zoom-drag', {
    init: function () {
      var el = this.el;
      var initialDistance = 0;
      var baseScale = { x: 1, y: 1, z: 1 };
      var isDragging = false;
      var previousTouchPosition = { x: 0, y: 0 };

      // Touch Start: Detect 1 finger (drag) vs 2 fingers (pinch)
      window.addEventListener('touchstart', function (e) {
        if (e.touches.length === 2) {
          isDragging = false; // Stop dragging when pitching
          var dx = e.touches[0].clientX - e.touches[1].clientX;
          var dy = e.touches[0].clientY - e.touches[1].clientY;
          initialDistance = Math.hypot(dx, dy);
          
          // Get current scale object
          var currentScale = el.getAttribute('scale');
          baseScale = { x: currentScale.x, y: currentScale.y, z: currentScale.z };
        } else if (e.touches.length === 1) {
          isDragging = true;
          previousTouchPosition = {
            x: e.touches[0].clientX,
            y: e.touches[0].clientY
          };
        }
      }, { passive: false });

      // Touch Move: Handle Zoom or Move
      window.addEventListener('touchmove', function (e) {
        // 2-Finger Pinch Zoom
        if (e.touches.length === 2 && initialDistance > 0) {
          e.preventDefault(); // Stop mobile browser default zoom collisions
          
          var dx = e.touches[0].clientX - e.touches[1].clientX;
          var dy = e.touches[0].clientY - e.touches[1].clientY;
          var distance = Math.hypot(dx, dy);
          
          // Calculate scale ratio
          var factor = distance / initialDistance;
          var newX = Math.max(0.3, Math.min(baseScale.x * factor, 5));
          var newY = Math.max(0.53, Math.min(baseScale.y * factor, 8.85)); // Maintains aspect ratio

          el.setAttribute('scale', { x: newX, y: newY, z: 1 });
        } 
        // 1-Finger Drag
        else if (e.touches.length === 1 && isDragging) {
          var deltaX = (e.touches[0].clientX - previousTouchPosition.x) * 0.006;
          var deltaY = (e.touches[0].clientY - previousTouchPosition.y) * 0.006;

          var currentPos = el.getAttribute('position');
          el.setAttribute('position', {
            x: currentPos.x + deltaX,
            y: currentPos.y - deltaY,
            z: currentPos.z
          });

          previousTouchPosition = {
            x: e.touches[0].clientX,
            y: e.touches[0].clientY
          };
        }
      }, { passive: false });

      // Touch End: Reset states cleanly
      window.addEventListener('touchend', function (e) {
        if (e.touches.length < 2) {
          initialDistance = 0;
        }
        if (e.touches.length === 0) {
          isDragging = false;
        }
      });
    }
  });
</script>
