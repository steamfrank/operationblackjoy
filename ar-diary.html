<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR Diary Experience</title>
  
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
      touch-action: none; /* Prevents mobile browser viewport zooming */
    }

    .ar-instruction {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85);
      color: #f3e9dc;
      padding: 10px 18px;
      border-radius: 20px;
      border: 1.5px solid #dda136;
      font-size: 0.85rem;
      font-weight: 600;
      z-index: 999;
      pointer-events: none;
      text-align: center;
    }
  </style>

  <script>
    // Native Pinch-to-Zoom & Drag Component
    AFRAME.registerComponent('pinch-zoom-drag', {
      init: function () {
        var el = this.el;
        var initialDistance = null;
        var initialScale = { x: 1, y: 1, z: 1 };
        var isDragging = false;
        var previousTouchPosition = { x: 0, y: 0 };

        // Handle Touch Start
        window.addEventListener('touchstart', function (e) {
          if (e.touches.length === 2) {
            // Calculate distance between two fingers for pinch
            var dx = e.touches[0].clientX - e.touches[1].clientX;
            var dy = e.touches[0].clientY - e.touches[1].clientY;
            initialDistance = Math.hypot(dx, dy);
            initialScale = Object.assign({}, el.getAttribute('scale'));
          } else if (e.touches.length === 1) {
            // Single finger touch for dragging
            isDragging = true;
            previousTouchPosition = {
              x: e.touches[0].clientX,
              y: e.touches[0].clientY
            };
          }
        });

        // Handle Touch Move
        window.addEventListener('touchmove', function (e) {
          // 2-Finger Pinch Zoom
          if (e.touches.length === 2 && initialDistance) {
            var dx = e.touches[0].clientX - e.touches[1].clientX;
            var dy = e.touches[0].clientY - e.touches[1].clientY;
            var distance = Math.hypot(dx, dy);
            var factor = distance / initialDistance;

            var newScale = {
              x: Math.max(0.3, Math.min(initialScale.x * factor, 4)),
              y: Math.max(0.3, Math.min(initialScale.y * factor, 4)),
              z: 1
            };

            el.setAttribute('scale', newScale);
          } 
          // 1-Finger Drag Position
          else if (e.touches.length === 1 && isDragging) {
            var deltaX = (e.touches[0].clientX - previousTouchPosition.x) * 0.005;
            var deltaY = (e.touches[0].clientY - previousTouchPosition.y) * 0.005;

            var currentPos = el.getAttribute('position');
            el.setAttribute('position', {
              x: currentPos.x + deltaX,
              y: currentPos.y - deltaY, // Inverted Y-axis for intuitive drag
              z: currentPos.z
            });

            previousTouchPosition = {
              x: e.touches[0].clientX,
              y: e.touches[0].clientY
            };
          }
        });

        // Handle Touch End
        window.addEventListener('touchend', function (e) {
          if (e.touches.length < 2) {
            initialDistance = null;
          }
          if (e.touches.length === 0) {
            isDragging = false;
          }
        });
      }
    });
  </script>
</head>
<body>

  <div class="ar-instruction">Pinch to zoom • Drag with 1 finger to move</div>

  <a-scene 
    embedded 
    arjs="sourceType: webcam; debugUIEnabled: false;"
    vr-mode-ui="enabled: false">
    
    <a-assets>
      <img id="diary-img" src="assets/joy/joy-diary-text.png">
    </a-assets>

    <a-entity camera></a-entity>

    <a-plane 
      src="#diary-img" 
      position="0 0 -3" 
      width="1" 
      height="1.77" 
      material="transparent: true; opacity: 0.98;"
      pinch-zoom-drag>
    </a-plane>

  </a-scene>

</body>
</html>
