<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR Diary Experience</title>
  
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
      touch-action: none; /* Stops mobile browser viewport zooming */
    }

    .ar-instruction {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85);
      color: #f3e9dc;
      padding: 10px 18px;
      border-radius: 20px;
      border: 1.5px solid #dda136;
      font-size: 0.85rem;
      font-weight: 600;
      z-index: 999;
      pointer-events: none;
      text-align: center;
    }
  </style>

  <script>
    AFRAME.registerComponent('pinch-zoom-drag', {
      init: function () {
        var el = this.el;
        var initialDistance = 0;
        var baseScale = { x: 1, y: 1, z: 1 };
        var isDragging = false;
        var previousTouchPosition = { x: 0, y: 0 };

        // Touch Start: Detect 1 finger (drag) vs 2 fingers (pinch)
        window.addEventListener('touchstart', function (e) {
          if (e.touches.length === 2) {
            isDragging = false; // Stop dragging when pinching
            var dx = e.touches[0].clientX - e.touches[1].clientX;
            var dy = e.touches[0].clientY - e.touches[1].clientY;
            initialDistance = Math.hypot(dx, dy);
            
            var currentScale = el.getAttribute('scale');
            baseScale = { x: currentScale.x, y: currentScale.y, z: currentScale.z };
          } else if (e.touches.length === 1) {
            isDragging = true;
            previousTouchPosition = {
              x: e.touches[0].clientX,
              y: e.touches[0].clientY
            };
          }
        }, { passive: false });

        // Touch Move: Handle Zoom or Move
        window.addEventListener('touchmove', function (e) {
          // 2-Finger Pinch Zoom
          if (e.touches.length === 2 && initialDistance > 0) {
            e.preventDefault(); // Stop mobile browser default zoom collisions
            
            var dx = e.touches[0].clientX - e.touches[1].clientX;
            var dy = e.touches[0].clientY - e.touches[1].clientY;
            var distance = Math.hypot(dx, dy);
            
            var factor = distance / initialDistance;
            var newX = Math.max(0.3, Math.min(baseScale.x * factor, 5));
            var newY = Math.max(0.53, Math.min(baseScale.y * factor, 8.85)); // Maintains aspect ratio

            el.setAttribute('scale', { x: newX, y: newY, z: 1 });
          } 
          // 1-Finger Drag
          else if (e.touches.length === 1 && isDragging) {
            var deltaX = (e.touches[0].clientX - previousTouchPosition.x) * 0.006;
            var deltaY = (e.touches[0].clientY - previousTouchPosition.y) * 0.006;

            var currentPos = el.getAttribute('position');
            el.setAttribute('position', {
              x: currentPos.x + deltaX,
              y: currentPos.y - deltaY,
              z: currentPos.z
            });

            previousTouchPosition = {
              x: e.touches[0].clientX,
              y: e.touches[0].clientY
            };
          }
        }, { passive: false });

        // Touch End: Reset states cleanly
        window.addEventListener('touchend', function (e) {
          if (e.touches.length < 2) {
            initialDistance = 0;
          }
          if (e.touches.length === 0) {
            isDragging = false;
          }
        });
      }
    });
  </script>
</head>
<body>

  <div class="ar-instruction">Pinch to zoom • Drag with 1 finger to move</div>

  <a-scene 
    embedded 
    arjs="sourceType: webcam; debugUIEnabled: false;"
    vr-mode-ui="enabled: false">
    
    <a-assets>
      <img id="diary-img" src="assets/joy/joy-diary-text.png">
    </a-assets>

    <a-entity camera></a-entity>

    <a-plane 
      src="#diary-img" 
      position="0 0 -3" 
      width="1" 
      height="1.77" 
      material="transparent: true; opacity: 0.98;"
      pinch-zoom-drag>
    </a-plane>

  </a-scene>

</body>
</html>
